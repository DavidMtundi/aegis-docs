name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required paths present
        run: |
          set -euo pipefail
          required=(
            README.md
            product-requirements-and-architecture.md
            plans/2026-10-01-aegis-build-roadmap.md
            designs/2026-10-28-phase-5-hardening.md
            designs/2026-10-28-phase-5-1-observability.md
            designs/2026-10-28-phase-5-5-load-baseline.md
            designs/2026-10-28-phase-5-7-security-review-note.md
            runbooks/postgres-backup-restore.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "ok: $f"
            fi
          done
          exit "$missing"
      - name: Markdown files non-empty
        run: |
          set -euo pipefail
          find . -name '*.md' -not -path './.git/*' | while read -r f; do
            if [[ ! -s "$f" ]]; then
              echo "EMPTY: $f"
              exit 1
            fi
          done
          echo "All markdown files have content."
      - name: No broken relative links in README
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path(".")
          text = (root / "README.md").read_text()
          links = re.findall(r"\]\((\./[^)#]+)", text)
          bad = [l for l in links if not (root / l[2:]).exists()]
          if bad:
              print("Broken README links:", bad)
              sys.exit(1)
          print(f"Checked {len(links)} relative README links.")
          PY
